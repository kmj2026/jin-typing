<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>仁くん用タイピングゲーム</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Teko:wght@600;700&family=M+PLUS+Rounded+1c:wght@500;800;900&display=swap" rel="stylesheet">
    <!-- Font Awesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        cyber: {
                            bg: '#0f172a',
                            card: '#1e293b',
                            accent: '#facc15', // Neon Yellow
                            blue: '#38bdf8',   // Neon Blue
                            pink: '#f43f5e',   // Neon Pink
                            green: '#4ade80'   // Neon Green
                        }
                    },
                    fontFamily: {
                        sans: ['"M PLUS Rounded 1c"', 'sans-serif'],
                        teko: ['Teko', 'sans-serif']
                    }
                }
            }
        }
    </script>
    <style>
        body {
            background-color: #0f172a;
            background-image: 
                radial-gradient(at 0% 0%, rgba(56, 189, 248, 0.15) 0px, transparent 50%),
                radial-gradient(at 100% 100%, rgba(244, 63, 94, 0.15) 0px, transparent 50%);
            background-attachment: fixed;
            color: #f8fafc;
        }
        .pop-card {
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.5), 0 8px 10px -6px rgba(0, 0, 0, 0.5);
            border: 3px solid #38bdf8;
        }
        .pop-button {
            transition: all 0.1s ease;
            box-shadow: 0 4px 0 #0284c7;
        }
        .pop-button:active {
            transform: translateY(4px);
            box-shadow: 0 0 0 #0284c7;
        }
    </style>
</head>
<body class="min-h-screen flex flex-col items-center justify-between p-4 font-sans">

    <!-- ヘッダー -->
    <header class="w-full max-w-2xl text-center py-4">
        <h1 class="text-4xl md:text-5xl font-black text-cyber-accent tracking-wider drop-shadow-[0_3px_3px_rgba(0,0,0,0.8)]">
            ⌨️ 仁くん用タイピングゲーム ⌨️
        </h1>
        <p class="text-sm text-cyber-blue font-bold mt-1">キーボードを叩いて地理を極めよう！</p>
    </header>

    <!-- メインエリア -->
    <main class="w-full max-w-2xl bg-cyber-card rounded-3xl p-6 md:p-8 pop-card mb-6 space-y-8">

        <!-- 1. なまえ入力＆モード選択画面 -->
        <div id="start-screen" class="space-y-6">
            <h2 class="text-2xl font-black text-center text-white mb-2">
                <i class="fa-solid fa-gamepad text-cyber-accent mr-2"></i>プレイヤー情報とコースを選んでね！
            </h2>
            
            <div class="space-y-2 text-left">
                <label class="text-sm font-bold text-cyber-blue"><i class="fa-solid fa-user mr-2"></i>プレイヤーのなまえ：</label>
                <input type="text" id="player-name" placeholder="なまえを入力（例: じん）" 
                    class="w-full p-4 rounded-2xl bg-slate-900 border-2 border-cyber-blue text-white font-bold text-xl text-center focus:outline-none focus:border-cyber-accent">
            </div>

            <div class="space-y-3 pt-2">
                <label class="text-sm font-bold text-cyber-blue"><i class="fa-solid fa-map-location-dot mr-2"></i>チャレンジするコース：</label>
                <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                    <button onclick="startGame('hokkaido')" class="pop-button flex flex-col items-center justify-center p-5 bg-sky-500 hover:bg-sky-400 text-slate-900 font-black text-xl rounded-2xl border-2 border-white">
                        <span><i class="fa-solid fa-mountain-sun mr-2"></i>北海道市町村コース</span>
                        <span class="text-xs text-slate-800 font-bold mt-1">全179市町村 完全網羅！</span>
                    </button>
                    <button onclick="startGame('japan')" class="pop-button flex flex-col items-center justify-center p-5 bg-amber-500 hover:bg-amber-400 text-slate-900 font-black text-xl rounded-2xl border-2 border-white">
                        <span><i class="fa-solid fa-map mr-2"></i>全国都道府県コース</span>
                        <span class="text-xs text-slate-800 font-bold mt-1">全国47都道府県</span>
                    </button>
                </div>
            </div>

            <!-- ランキングボード表示エリア -->
            <div class="mt-8 bg-slate-900/90 p-5 rounded-2xl border-2 border-cyber-accent space-y-3">
                <h3 class="text-lg font-black text-cyber-accent flex items-center justify-center">
                    <i class="fa-solid fa-crown mr-2 text-yellow-400"></i>ハイスコアランキング TOP 5
                </h3>
                <div id="ranking-list" class="space-y-2">
                    <p class="text-center text-sm text-slate-400 py-2">ランキングを読み込み中...</p>
                </div>
            </div>
        </div>

        <!-- 2. タイピングゲーム画面 -->
        <div id="game-screen" class="hidden space-y-6">
            <div class="flex justify-between items-center bg-slate-900/80 p-4 rounded-2xl border border-slate-700">
                <span id="current-mode-title" class="text-xl font-black text-cyber-accent">北海道市町村コース</span>
                <div class="flex items-center space-x-4">
                    <span class="text-sm font-bold text-slate-300">プレイヤー: <span id="disp-name" class="text-white"></span></span>
                    <span id="timer" class="text-2xl font-teko font-bold text-cyber-pink bg-slate-900 px-3 py-1 rounded-xl border border-cyber-pink">60</span>
                </div>
            </div>

            <div class="bg-slate-900 p-8 rounded-2xl border-2 border-cyber-blue text-center space-y-3">
                <div id="kanji-display" class="text-4xl md:text-5xl font-black text-cyber-accent tracking-wider drop-shadow">古平町</div>
                <div id="hiragana-display" class="text-lg text-slate-400 font-bold">ふるびらちょう</div>
                
                <div id="romaji-display" class="text-2xl md:text-3xl font-mono font-bold tracking-widest text-white mt-6 bg-slate-950 p-4 rounded-xl border border-slate-800">
                    <span id="typed-romaji" class="text-cyber-green underline"></span><span id="untyped-romaji" class="text-slate-500"></span>
                </div>
            </div>

            <div class="flex justify-around text-base font-bold bg-slate-900/50 p-3 rounded-xl border border-slate-700">
                <div class="text-slate-300">正打数: <span id="score-count" class="text-cyber-green text-xl font-black">0</span></div>
                <div class="text-slate-300">ミス数: <span id="miss-count" class="text-cyber-pink text-xl font-black">0</span></div>
            </div>
        </div>

        <!-- 3. 結果画面 -->
        <div id="result-screen" class="hidden text-center space-y-6">
            <h2 class="text-3xl font-black text-cyber-accent">🎉 タイムアップ！お疲れ様！ 🎉</h2>
            <div class="bg-slate-900 p-6 rounded-2xl border border-slate-700 space-y-3">
                <p class="text-slate-400 font-bold">今回のスコア（正打数）</p>
                <p id="final-score" class="text-5xl font-black text-cyber-green">0 点</p>
                <p id="send-status" class="text-sm text-cyber-blue font-bold">結果をスプレッドシートに送信中...</p>
            </div>
            <button onclick="location.reload()" class="pop-button w-full py-4 bg-cyber-accent text-slate-900 font-black text-xl rounded-2xl border-2 border-white">
                <i class="fa-solid fa-house mr-2"></i>メニューに戻る
            </button>
        </div>

    </main>

    <!-- フッター -->
    <footer class="text-center text-xs text-slate-500 font-bold pb-2">
        kmj
    </footer>

        // 更新されたGAS WEBアプリURL
        const GAS_URL = "https://script.google.com/macros/s/AKfycbzOlhnkZDCdDLNASIit1V4kGsiWMrKrtxOclv9W4HMAU7GXVekPzaZtx4BzJQruUCKnMA/exec";

        // ページ読み込み時にランキングを取得して表示
        window.addEventListener('DOMContentLoaded', () => {
            fetch(GAS_URL)
                .then(response => response.json())
                .then(data => {
                    const rankingList = document.getElementById('ranking-list');
                    if (!data || data.length === 0) {
                        rankingList.innerHTML = '<p class="text-center text-xs text-slate-400 py-2">まだ記録がありません。一番乗りを目指そう！</p>';
                        return;

                    let html = '';
                    data.forEach((item, index) => {
                        let rankClass = "text-slate-300";
                        let badgeIcon = `<span class="font-teko text-lg px-2">${index + 1}位</span>`;
                        if (index === 0) {
                            rankClass = "text-yellow-300 bg-yellow-500/10 border-yellow-500/30";
                            badgeIcon = `<i class="fa-solid fa-crown text-yellow-400 mr-1"></i>1位`;
                        } else if (index === 1) {
                            rankClass = "text-slate-200 bg-slate-400/10 border-slate-400/30";
                            badgeIcon = `<i class="fa-solid fa-medal text-slate-300 mr-1"></i>2位`;
                        } else if (index === 2) {
                            rankClass = "text-amber-500 bg-amber-600/10 border-amber-600/30";
                            badgeIcon = `<i class="fa-solid fa-medal text-amber-500 mr-1"></i>3位`;
                        }

                        html += `
                            <div class="flex items-center justify-between p-2.5 rounded-xl border border-slate-700 bg-slate-950/50 ${rankClass}">
                                <div class="flex items-center space-x-3 font-bold text-sm">
                                    <span class="w-12 text-center">${badgeIcon}</span>
                                    <span class="text-white">${escapeHtml(item.name)}</span>
                                </div>
                                <div class="font-teko text-2xl font-bold tracking-wider text-cyber-green">
                                    ${item.score} <span class="text-xs font-sans text-slate-400">点</span>
                                </div>
                            </div>
                        `;
                    });
                    rankingList.innerHTML = html;
                })
                .catch(() => {

                { kanji: "愛知県", kana: "あいちけん" }, { kanji: "三重県", kana: "みえけん" },
                { kanji: "滋賀県", kana: "しがけん" }, { kanji: "京都府", kana: "きょうとふ" },
                { kanji: "大阪府", kana: "おおさかふ" }, { kanji: "兵庫県", kana: "ひょうごけん" },
                { kanji: "奈良県", kana: "ならけん" }, { kanji: "和歌山県", kana: "わかやまけん" },
                { kanji: "鳥取県", kana: "とっとりけん" }, { kanji: "島根県", kana: "しまねけん" },
                { kanji: "岡山県", kana: "おかやまけん" }, { kanji: "広島県", kana: "ひろしまけん" },
                { kanji: "山口県", kana: "やまぐちけん" }, { kanji: "徳島県", kana: "とくしまけん" },
                { kanji: "香川県", kana: "かがわけん" }, { kanji: "愛媛県", kana: "えひめけん" },
                { kanji: "高知県", kana: "こうちけん" }, { kanji: "福岡県", kana: "ふくおかけん" },
                { kanji: "佐賀県", kana: "さがけん" }, { kanji: "長崎県", kana: "ながさきけん" },
                { kanji: "熊本県", kana: "くまもとけん" }, { kanji: "大分県", kana: "おおいたけん" },
                { kanji: "宮崎県", kana: "みやざきけん" }, { kanji: "鹿児島県", kana: "かごしまけん" },
                { kanji: "沖縄県", kana: "おきなわけん" }
            ]
        };

        let playerName = "";
        let currentMode = "";
        let currentWord = {};
        let score = 0;
        let miss = 0;
        let timeLeft = 60;
        let timerInterval;
        let kanaNodes = [];
        let typedInputString = "";

        function buildKanaTree(kana) {
            let i = 0;
            let nodes = [];
            while (i < kana.length) {
                let char2 = kana.substring(i, i + 2);
                let char1 = kana.substring(i, i + 1);

                if (char1 === 'っ' && i + 1 < kana.length) {
                    let nextKana = kana.substring(i + 1, i + 3);
                    let nextPatterns = romaMap[nextKana] || romaMap[kana.substring(i + 1, i + 2)];
                    if (nextPatterns) {
                        let sokuonPatterns = [];
                        nextPatterns.forEach(p => sokuonPatterns.push(p.charAt(0)));
                        (romaMap['っ'] || []).forEach(p => sokuonPatterns.push(p));
                        nodes.push({ kana: 'っ', patterns: Array.from(new Set(sokuonPatterns)) });
                        i++;
                        continue;
                    }
                }

                if (romaMap[char2]) {
                    nodes.push({ kana: char2, patterns: romaMap[char2] });
                    i += 2;
                } else if (romaMap[char1]) {
                    nodes.push({ kana: char1, patterns: romaMap[char1] });
                    i += 1;
                } else {
                    nodes.push({ kana: char1, patterns: [char1] });
                    i += 1;
                }
            }
            return nodes;
        }

        function startGame(mode) {
            playerName = document.getElementById('player-name').value.trim();
            if (!playerName) {
                alert("プレイヤーのなまえを入力してね！");
                return;
            }

            currentMode = mode;
            document.getElementById('disp-name').innerText = playerName;
            document.getElementById('current-mode-title').innerText = 
                mode === 'hokkaido' ? '北海道市町村コース' : '全国都道府県コース';

            document.getElementById('start-screen').classList.add('hidden');
            document.getElementById('game-screen').classList.remove('hidden');

            window.addEventListener('keydown', handleKeyPress);
            nextWord();
            startTimer();
        }

        function nextWord() {
            const list = wordBanks[currentMode];
            currentWord = list[Math.floor(Math.random() * list.length)];
            kanaNodes = buildKanaTree(currentWord.kana);
            typedInputString = "";
            updateWordDisplay();
        }

        function updateWordDisplay() {
            document.getElementById('kanji-display').innerText = currentWord.kanji;
            document.getElementById('hiragana-display').innerText = currentWord.kana;
            let displayRomaji = kanaNodes.map(node => node.patterns[0]).join('');
            document.getElementById('typed-romaji').innerText = typedInputString;
            document.getElementById('untyped-romaji').innerText = displayRomaji.substring(typedInputString.length);
        }

        function handleKeyPress(e) {
            if (timeLeft <= 0) return;
            const key = e.key.toLowerCase();
            if (key.length !== 1 || e.ctrlKey || e.metaKey || e.altKey) return;

            let testInput = typedInputString + key;
            if (checkValidPrefix(testInput)) {
                typedInputString = testInput;
                score++;
                document.getElementById('score-count').innerText = score;
                if (isWordCompleted(typedInputString)) {
                    nextWord();
                } else {
                    updateWordDisplay();
                }
            } else {
                miss++;
                document.getElementById('miss-count').innerText = miss;
            }
        }

        function checkValidPrefix(input) {
            return generateAllCombinedPatterns(kanaNodes, 0, "").some(pattern => pattern.startsWith(input));
        }

        function isWordCompleted(input) {
            return generateAllCombinedPatterns(kanaNodes, 0, "").some(pattern => pattern === input);
        }

        function generateAllCombinedPatterns(nodes, index, current) {
            if (index >= nodes.length) return [current];
            let results = [];
            for (let p of nodes[index].patterns) {
                results.push(...generateAllCombinedPatterns(nodes, index + 1, current + p));
            }
            return results;
        }

        function startTimer() {
            timerInterval = setInterval(() => {
                timeLeft--;
                document.getElementById('timer').innerText = timeLeft;
                if (timeLeft <= 0) {
                    clearInterval(timerInterval);
                    endGame();
                }
            }, 1000);
        }

        function endGame() {
            window.removeEventListener('keydown', handleKeyPress);
            document.getElementById('game-screen').classList.add('hidden');
            document.getElementById('result-screen').classList.remove('hidden');
            document.getElementById('final-score').innerText = `${score} 点`;

            if (GAS_URL && GAS_URL !== "YOUR_GAS_WEB_APP_URL_HERE") {
                fetch(GAS_URL, {
                    method: 'POST',
                    mode: 'no-cors',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        name: `${playerName} (${currentMode === 'hokkaido' ? '北海道' : '全国'})`,
                        score: score,
                        correct: score,
                        miss: miss
                    })
                }).then(() => {
                    document.getElementById('send-status').innerText = "✅ スプレッドシートに記録を保存しました！";
                }).catch(() => {
                    document.getElementById('send-status').innerText = "⚠️ 送信エラーが発生しました";
                });
            } else {
                document.getElementById('send-status').innerText = "（※GAS URL未設定）";
            }
        }
    </script>
